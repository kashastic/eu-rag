# Production stack — multi-instance ready. `docker compose -f docker-compose.prod.yml up`
#
# Shared state lives in Postgres (users, refresh tokens, audit, chat history),
# Qdrant (vectors), and Redis (rate-limit buckets), so the `api` service can be
# scaled to N replicas behind Caddy without any per-instance state. Caddy serves
# the Next.js app and the API on ONE origin (no CORS), routing API paths to the
# backend and everything else to the web app.
#
# Set the secrets in a .env file next to this compose (see .env.example):
#   POSTGRES_PASSWORD, EURAG_JWT_SECRET (openssl rand -hex 32),
#   EURAG_ENCRYPTION_KEY (openssl rand -hex 32), ANTHROPIC_API_KEY
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eurag
      POSTGRES_USER: eurag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eurag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qdrant:/qdrant/storage]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # One-shot corpus job: fetch any missing data/raw caches (network), embed,
  # and write the registry + vectors. Runs to completion before any api
  # replica starts, so the replicas never scrape or embed — they just serve.
  # With a populated ./data/raw (rsync'd from a dev machine) nothing is
  # fetched and this is a fast no-op re-check.
  seeder:
    build: .
    image: eurag-api:latest
    entrypoint:
      ["python", "-m", "data.seed", "--scrape", "--expect-docs", "${EURAG_EXPECT_DOCS:-47}"]
    environment:
      EURAG_STRICT_BOOT: "true"                  # no silent hash-embedder fallback
      EURAG_ENCRYPTION_KEY: ${EURAG_ENCRYPTION_KEY}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/raw:/app/data/raw
      - apivar:/app/var
      - modelcache:/home/eurag/.cache
    depends_on:
      qdrant: { condition: service_started }
    restart: "no"

  api:
    build: .
    image: eurag-api:latest
    environment:
      EURAG_AUTH_ENABLED: "true"
      EURAG_STRICT_BOOT: "true"
      EURAG_JWT_SECRET: ${EURAG_JWT_SECRET}
      EURAG_ENCRYPTION_KEY: ${EURAG_ENCRYPTION_KEY}
      EURAG_DATABASE_URL: postgresql://eurag:${POSTGRES_PASSWORD}@postgres:5432/eurag
      QDRANT_URL: http://qdrant:6333
      EURAG_REDIS_URL: redis://redis:6379/0
      # only Caddy can reach the api service, and it rewrites X-Forwarded-For,
      # so the first hop is the real client — without this every visitor would
      # share Caddy's single rate-limit bucket and quota key
      EURAG_TRUST_PROXY: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Free anonymous questions per IP/day, billed to the server's key. Listed
      # here explicitly because the container gets no env_file — without this
      # line, setting it in the VM's .env changes nothing and the code default
      # silently wins. 0 = BYOK-only.
      EURAG_FREE_ANON_QUESTIONS: ${EURAG_FREE_ANON_QUESTIONS:-2}
      # lifetime free questions per logged-in account, then BYOK is required
      EURAG_FREE_USER_QUESTIONS: ${EURAG_FREE_USER_QUESTIONS:-10}
      # bot gate on the anon funnel + registration; empty = off (see .env.example)
      EURAG_TURNSTILE_SITEKEY: ${EURAG_TURNSTILE_SITEKEY:-}
      EURAG_TURNSTILE_SECRET: ${EURAG_TURNSTILE_SECRET:-}
    volumes:
      - ./data/raw:/app/data/raw   # corpus cache (shared with the seeder)
      - apivar:/app/var            # registry + jwt material, seeded once
      - modelcache:/home/eurag/.cache   # ONNX models downloaded once
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
      redis: { condition: service_started }
      seeder: { condition: service_completed_successfully }
    deploy:
      # All state is shared, so this scales freely — but memory is the limit:
      # measured ~1.4GB idle / ~2.4GB peak at 1 replica, ~2.2GB / ~3.2GB at 2
      # (an api replica is 835MB idle but 1.83GB while answering). 1 fits a 4GB
      # box with headroom; raise it on a bigger host. See docs/DEPLOY.md §4.
      replicas: 1
    restart: unless-stopped

  web:
    build: ./frontend/web
    image: eurag-web:latest
    environment:
      NEXT_PUBLIC_API_URL: ""   # same-origin behind Caddy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      # Caddy substitutes this into the Caddyfile's site address; a real domain
      # switches it to :443 with an auto-provisioned cert. The fallback MUST be
      # supplied here, not left to the Caddyfile's `{$EURAG_DOMAIN::80}`
      # default: an env var set to the *empty* string is not "unset", so the
      # site address would collapse and Caddy would fail to parse the file.
      EURAG_DOMAIN: ${EURAG_DOMAIN:-:80}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    restart: unless-stopped

volumes:
  pgdata:
  qdrant:
  apivar:
  modelcache:
  caddy_data:
  caddy_config:
