name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest (offline suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches the API image (Dockerfile)
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # The suite is offline by design: hash embedder, no reranker, no API key.
      - name: Test
        run: pytest -q

  web:
    name: next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches frontend/web/Dockerfile
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  postgres:
    name: postgres parity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: eurag
          POSTGRES_DB: eurag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EURAG_TEST_DATABASE_URL: postgresql://postgres:eurag@localhost:5432/eurag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,prod]"

      # tests/test_postgres.py skips itself when the URL is unset or unusable,
      # so connect once first — otherwise a broken service would pass green.
      - name: Check Postgres is reachable
        run: python -c "import os, psycopg; psycopg.connect(os.environ['EURAG_TEST_DATABASE_URL']).close()"

      - name: Test
        run: pytest tests/test_postgres.py -q
