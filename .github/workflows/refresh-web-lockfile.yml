# One-off: upgrade the web app's framework packages and regenerate the
# lockfile on a machine with registry access. Removed again in the same PR.
name: refresh-web-lockfile
on:
  push:
    branches: [security/nextjs-15.5.29]
    paths: [.github/workflows/refresh-web-lockfile.yml]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Next.js 15.x pins postcss 8.4.31; lift it and two transitive
      # packages to their patched releases within the same major version.
      - run: |
          npm pkg set 'overrides.postcss=>=8.5.23 <9'
          npm pkg set 'overrides.nanoid=>=3.3.18 <4'
          npm pkg set 'overrides.source-map-js=>=1.2.2 <2'
          npm install
      - run: npm ls next react react-dom postcss nanoid source-map-js
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: |
          git config user.name "Akash Acharya"
          git config user.email "44359944+kashastic@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Web: override postcss, nanoid and source-map-js to patched releases

          Next.js 15.x pins postcss 8.4.31. npm audit's only suggestion was a
          jump to Next.js 16; overrides keep the same major versions and leave
          npm audit clean for production dependencies."
          git push
